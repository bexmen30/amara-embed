<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amara Video</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

<div id="amara-container"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const amaraUrl = params.get("url");

  if (amaraUrl) {
    const match = amaraUrl.match(/amara\.org\/videos\/([^/]+)/);

    if (match) {
      const videoId = match[1];

      const embed = document.createElement("div");
      embed.className = "amara-embed";
      embed.setAttribute("data-video-id", videoId);
      embed.setAttribute("data-team", "bex");
      embed.setAttribute("data-show-subtitles-default", "true");

      document.getElementById("amara-container").appendChild(embed);

      const script = document.createElement("script");
      script.src = "https://amara.org/embedder-iframe";
      document.body.appendChild(script);
    } else {
      document.getElementById("amara-container").innerHTML =
        "<p>Invalid Amara video URL.</p>";
    }
  } else {
    document.getElementById("amara-container").innerHTML =
      "<p>No Amara video URL provided.</p>";
  }
</script>

</body>
</html>
