<!DOCTYPE html>
<html>
<head>
  <title>Amara Video</title>
</head>

<body>

<div
  id="amara-player"
  class="amara-embed"
  data-team="bex"
  data-show-subtitles-default="true">
</div>

<script>
  const videoId = window.location.pathname.split("/").filter(Boolean).pop();

  document
    .getElementById("amara-player")
    .setAttribute("data-video-id", videoId);
</script>

<script
  type="text/javascript"
  src="https://amara.org/embedder-iframe">
</script>

</body>
</html>
